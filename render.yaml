services:
  - type: web
    name: eda-music-frontend-static
    env: static
    autoDeploy: true
    staticPublishPath: static
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: eda-music-backend
    env: python
    autoDeploy: true
    buildCommand: pip install -r backend/requirements-render.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: OPENAI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI
        value: https://example.com/callback
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
